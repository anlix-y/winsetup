# zapret (bol-van) нет в winget и нет установщика — распаковываем архив сборки для Windows.
# Стратегию обхода под своего провайдера пользователь выбирает сам (blockcheck в архиве).
[[software]]
category = "Сеть и VPN"
name = "zapret (bol-van), архив в C:\\zapret"
url = "https://github.com/bol-van/zapret-win-bundle/archive/refs/heads/master.zip"
extract_to = 'C:\zapret'
check_path = 'C:\zapret\zapret-win-bundle-master'

