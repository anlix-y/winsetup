"Путь к разделу: HKLM\\… — для всего ПК, HKCU\\… — для текущего пользователя." = "Key path: HKLM\\… — whole PC, HKCU\\… — current user."
"DWORD — число (флаги 0/1), строка — текст, список строк — через «;»." = "DWORD — number (0/1 flags), string — text, string list — separated by «;»."
"Что записать. Неверное значение подсвечивается красным." = "What to write. An invalid value is highlighted in red."
"Короткое имя службы (не отображаемое): Spooler, wuauserv. Список — Get-Service." = "Short service name (not the display name): Spooler, wuauserv. List — Get-Service."
"Ставится при каждом запуске, если не совпадает. Хранится в конфиге открытым текстом!" = "Set on every run if it doesn't match. Stored in the config in plain text!"
"Administrators — администраторы, Users — обычные, Remote Desktop Users — вход по RDP." = "Administrators — admins, Users — regular, Remote Desktop Users — RDP sign-in."
"Имена компонентов через запятую, например NetFx3, TelnetClient. Может потребоваться перезагрузка." = "Feature names, comma-separated, e.g. NetFx3, TelnetClient. May require a reboot."
"Имена компонентов через запятую, например SMB1Protocol." = "Feature names, comma-separated, e.g. SMB1Protocol."
"Сбалансированная — обычный режим, высокая производительность — без экономии, экономия — для ноутбуков." = "Balanced — normal, high performance — no saving, power saver — for laptops."
"Через сколько минут бездействия ПК уснёт при работе от сети." = "Minutes of inactivity before the PC sleeps on AC power."
"Через сколько минут бездействия погаснет экран." = "Minutes of inactivity before the screen turns off."
"Автоматически — Windows сама ставит обновления, уведомлять — только сообщает, выключено — не проверяет (небезопасно)." = "Automatic — Windows installs updates itself, notify — only informs, disabled — doesn't check (unsafe)."
"На сколько дней отложить крупные обновления Windows (до 365). Исправления безопасности приходят как обычно." = "Days to defer major Windows updates (up to 365). Security fixes arrive as usual."
"Отправка диагностических данных в Microsoft." = "Sending diagnostic data to Microsoft."
"Рекламный ID, предложения приложений и советы в «Пуске»." = "Advertising ID, app suggestions and tips in Start."
"Показывать .exe, .txt и т.п. в Проводнике — помогает заметить вирусы вида «фото.jpg.exe»." = "Show .exe, .txt etc. in Explorer — helps spot malware like «photo.jpg.exe»."
"Показывать скрытые файлы и папки в Проводнике." = "Show hidden files and folders in Explorer."
"Имя правила в брандмауэре Windows. По нему правило находится при повторном запуске." = "Rule name in Windows Firewall. Used to find the rule on the next run."
"Имя параметра внутри раздела." = "Value name inside the key."
"Имя локальной учётной записи. Нет такой — будет создана." = "Local account name. Created if missing."
"Входящие — подключения к этому ПК, исходящие — из него наружу." = "Inbound — connections to this PC, outbound — from it."
"Разрешить или заблокировать подходящий трафик." = "Allow or block matching traffic."
"TCP/UDP — с портом; ICMP — ping; «любой» — весь трафик." = "TCP/UDP — with a port; ICMP — ping; «any» — all traffic."
"Тип запуска: автоматически — при старте Windows, вручную — по требованию, отключена — не запускается." = "Startup type: automatic — at Windows start, manual — on demand, disabled — never runs."
"Запустить или остановить службу сейчас." = "Start or stop the service now."
"Группы — английскими именами (Administrators, Users, Remote Desktop Users…), программа найдёт их на любой языковой версии Windows." = "Groups — by English names (Administrators, Users, Remote Desktop Users…); the program finds them on any Windows language version."
"Удалённый рабочий стол (TCP 3389). «Открыть» — разрешить входящие подключения к этому ПК, «Закрыть» — запретить." = "Remote Desktop (TCP 3389). «Open» — allow incoming connections to this PC, «Close» — block them."
"Общие папки и принтеры Windows. Закрытие защищает от сетевых червей (WannaCry), но общие папки на этом ПК перестанут работать." = "Windows file and printer sharing. Closing protects against network worms (WannaCry), but shared folders on this PC stop working."
"Ответ на ping (ICMP echo). Удобно для диагностики сети; запрет скрывает ПК от простого сканирования." = "Reply to ping (ICMP echo). Useful for network diagnostics; blocking hides the PC from simple scans."
"Брандмауэр в доменной, частной и общей сети. Выключать не рекомендуется." = "Firewall on domain, private and public networks. Turning it off is not recommended."
"Служба «Диспетчер печати» (Spooler). Если принтеров нет — лучше отключить: в ней бывали уязвимости (PrintNightmare)." = "Print Spooler service. If there are no printers, better disable it: it had vulnerabilities (PrintNightmare)."
"Служба RemoteRegistry: доступ к реестру этого ПК по сети. Обычно не нужна." = "RemoteRegistry service: network access to this PC's registry. Usually not needed."
"Службы Xbox Live и игровых контроллеров. На рабочих ПК не нужны." = "Xbox Live and game controller services. Not needed on work PCs."
"Устаревший протокол общих папок, небезопасен. Нужен только очень старым устройствам (старые МФУ, NAS)." = "Legacy file sharing protocol, insecure. Only needed by very old devices (old printers, NAS)."
"Нужен старым программам. При включении скачивается из Интернета." = "Required by older programs. Downloaded from the Internet when enabled."
"Встроенная виртуализация Windows (Pro/Enterprise). Нужна перезагрузка." = "Built-in Windows virtualization (Pro/Enterprise). Requires a reboot."
"Подсистема Linux для Windows. Нужна перезагрузка." = "Windows Subsystem for Linux. Requires a reboot."
"Автоматический запуск программ с подключённых дисков. Отключение защищает от вирусов на флешках." = "Automatic launch of programs from connected drives. Disabling protects against USB malware."
"Голосовой помощник Microsoft." = "Microsoft's voice assistant."
"Включён ли NumLock на экране входа в Windows." = "Whether NumLock is on at the Windows sign-in screen."
