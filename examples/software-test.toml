# Проверка модуля «софт» в ВМ.

[general]
on_error = "ask"

[[software]]
winget = "Notepad++.Notepad++"

[[software]]
name = "7-Zip 24.08"
url = "https://www.7-zip.org/a/7z2408-x64.exe"
args = "/S"
# SHA256 отключён: sha256 = "67cb9d3452c9dd974b04f4a5fd842dbcba8184f2344ff72e3662d7cdb68b099b"
