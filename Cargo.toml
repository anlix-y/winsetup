[package]
name = "winsetup"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
# SHA256 отключён: sha2 = "0.11.1"
toml = "1.2.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Console", "Win32_Globalization"] }
winreg = "0.56.0"

[profile.release]
strip = true
lto = "thin"
